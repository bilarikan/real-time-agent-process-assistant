[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "real-time-sales-assistant"
version = "0.1.0"
description = "Local real-time sales process assistant (Gemini Live + ADK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk>=2.8.0,<2.9",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
build = [
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "python-docx>=1.2,<2",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
sales-assistant = "app.server:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["PRD.md", "README.md", "knowledge"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
